<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="text-center">Stack Simulator</h1>
        <hr>
        <form action="/stack" method="POST">
            <div class="form-group">
                <label for="st_data">Value:</label>
                <input type="text" id="st_data" name="value" class="form-control" maxlength="24">
            </div>
            <div class="btn-group btn-group-justified">
                <div class="btn-group">
                    <button type="submit" name="action" value="push" class="btn btn-success">Push</button>
                </div>
                <div class="btn-group">
                    <button type="submit" name="action" value="pop" class="btn btn-warning">Pop</button>
                </div>
                <div class="btn-group">
                    <button type="submit" name="action" value="clear" class="btn btn-danger">Clear</button>
                </div>
            </div>
        </form>
        <hr>
        <h3>Stack Data — Count: {{ count }}</h3>
        <ul class="list-group">
            {% for item in stack|reverse %}
            <li class="list-group-item">{{ item }}</li>
            {% else %}
            <li class="list-group-item text-muted">Empty</li>
            {% endfor %}
        </ul>
    </div>
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
</body>
</html>
